<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Música</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="container">
        <h1>Cadastrar Nova Música</h1>
        <div class="nav-links">
            <a href="index.html">Ver Lista de Músicas</a>
        </div>

        <form id="form-musica">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="estilo">Estilo:</label>
                <input type="text" id="estilo" name="estilo" required>
            </div>
            <div class="form-group">
                <label for="artista">Artista:</label>
                <input type="text" id="artista" name="artista" required>
            </div>
            <div class="form-group">
                <label for="audio">Arquivo MP3:</label>
                <input type="file" id="audio" name="audio" accept=".mp3" required>
            </div>
            <button type="submit">Salvar Música</button>
        </form>
        <p id="mensagem"></p>
    </div>

    <script src="js/criarController.js"></script>
</body>
</html>
