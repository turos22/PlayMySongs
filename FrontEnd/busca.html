<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscar Músicas</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="container">
        <h1>Buscar Músicas</h1>
        <div class="nav-links">
            <a href="index.html">Início</a> | <a href="criar.html">Enviar Música</a>
        </div>

        <form id="form-busca">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div class="form-group">
                <label for="estilo">Estilo:</label>
                <select id="estilo" name="estilo">
                    <option value="">Carregando estilos...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="artista">Artista:</label>
                <input type="text" id="artista" name="artista">
            </div>
            <button type="submit">Buscar</button>
        </form>
        <p id="mensagem"></p>

        <div id="lista-musicas">
            <!-- As músicas serão carregadas aqui via JavaScript -->
        </div>
    </div>
    <script src="js/buscaController.js"></script>
</body>
</html>
